trigger:
  branches: { include: ['*'] }
  tags: { include: [v*] }

pr:
  branches: { include: [master, main] }

resources:
  repositories:
    - repository: ci
      type: git
      name: GAFS.Vpos/vpos-mono-package-mgr
      ref: refs/heads/compliance

extends:
  template: azure/templates/node-nextjs.yml@ci
  parameters:
    consumerPath: 'vpos-ftc-app'
    mainBranch: 'refs/heads/main'
    appInstallFolder: 'vposftc'
    artifactsPackageName: 'vpos-ftc-app'
    nodeVersion: '22.15.0'
    esbuildTarget: 'node22'
    startScriptTemplate: 'node-web'
    nextRuntimeIncludes:
      - src/platform/runtime/env-defaults.cjs
      - scripts/trace-net.cjs
    nextRuntimeRequiredPaths:
      - start.cjs
      - vpos-server.cjs
      - src/platform/runtime/env-defaults.cjs
      - scripts/trace-net.cjs
    runCpb539Node18: false
    runCpb539Node22: true
    runCpb579Node22: true
